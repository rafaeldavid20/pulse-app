name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy_rules_and_app:
    name: Deploy Firestore Rules & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      # Firestore rules are no longer deployed from this repo. Both repos
      # deploying to the same rules file — whichever push landed last winning
      # — was a real, previously-documented footgun (a pulse-app-only push
      # could silently revert hardening done in pulse-backend). pulse-backend
      # is now the single source of truth; see its firestore.rules and
      # deploy.yml.
