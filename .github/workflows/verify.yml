name: Verify Pulse App PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PQL_BACKEND_ROOT: ${{ github.workspace }}/node_modules/.pql-backend
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: rafaeldavid20/pulse-backend
          ref: ${{ github.head_ref == 'pul/tes-145-pql-sync' && 'pul/tes-145-pql-mcp' || 'main' }}
          path: node_modules/.pql-backend
          persist-credentials: false
      - run: npm run lint 2>&1 | tee -a verify-output.txt
      - run: npm test 2>&1 | tee -a verify-output.txt
      - run: npx tsc --noEmit 2>&1 | tee -a verify-output.txt
      - run: node --test scripts/*.test.mjs 2>&1 | tee -a verify-output.txt
      - run: npx next build --webpack 2>&1 | tee -a verify-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-output
          path: verify-output.txt
